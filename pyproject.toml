[project]
name = "mytests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "ruff>=0.16.5",
]

[tool.black]
line-length = 120
target-version = ['py314']

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
