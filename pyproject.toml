[project]
name = "mytests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "djangorestframework>=3.18.1",
    "gunicorn>=26.2.0",
    "loguru>=0.7.3",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "ruff>=0.16.5",
]

[tool.black]
line-length = 120
target-version = ['py314']

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    # Django 的迁移、模型 Meta、admin 类属性要求使用字面量，RUF012 在此为误报
    "RUF012",
]
