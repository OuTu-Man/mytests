<!DOCTYPE html>
<html>

<head>
    <title>{{ post.title }}</title>
</head>

<body>
    <article>
        <h1>{{ post.title }}</h1>
        <p>
            作者：{{ post.author }}
            {% if post.category %} · 分类：{{ post.category }}{% endif %}
            · {{ post.created_at }}
        </p>
        <div>{{ post.content|linebreaks }}</div>
    </article>
    <p><a href="{% url 'blog:list' %}">返回列表</a></p>
</body>

</html>
