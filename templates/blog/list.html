<!DOCTYPE html>
<html>

<head>
    <title>博客</title>
</head>

<body>
    <h1>文章列表</h1>
    {% for post in posts %}
    <article>
        <h2><a href="{% url 'blog:detail' post.pk %}">{{ post.title }}</a></h2>
        <p>{{ post.created_at }}</p>
    </article>
    {% empty %}
    <p>暂无文章</p>
    {% endfor %}
</body>

</html>
